<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1440" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A2332"/>
      <stop offset="0.45" stop-color="#2D3F5C"/>
      <stop offset="1" stop-color="#4A3728"/>
    </linearGradient>
    <radialGradient id="lantern1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(380 180) rotate(90) scale(220)">
      <stop stop-color="#F2CC8F" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#E07A5F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E07A5F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 140) rotate(90) scale(260)">
      <stop stop-color="#FFD89B" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#E07A5F" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E07A5F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 620) rotate(90) scale(400 180)">
      <stop stop-color="#F2CC8F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1A2332" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5C4033"/>
      <stop offset="1" stop-color="#3D2B22"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8B2942"/>
      <stop offset="1" stop-color="#5A1A2B"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1440" height="720" fill="url(#sky)"/>
  <ellipse cx="380" cy="180" rx="280" ry="220" fill="url(#lantern1)" filter="url(#softBlur)"/>
  <ellipse cx="980" cy="140" rx="320" ry="240" fill="url(#lantern2)" filter="url(#softBlur)"/>
  <ellipse cx="720" cy="620" rx="520" ry="180" fill="url(#floorGlow)"/>

  <!-- Wooden beams -->
  <rect x="0" y="0" width="1440" height="28" fill="#2A1F18" opacity="0.7"/>
  <rect x="120" y="28" width="18" height="420" fill="url(#wood)" opacity="0.55"/>
  <rect x="720" y="28" width="14" height="380" fill="url(#wood)" opacity="0.45"/>
  <rect x="1180" y="28" width="16" height="400" fill="url(#wood)" opacity="0.5"/>

  <!-- Window / moon -->
  <circle cx="1180" cy="120" r="48" fill="#FAF7F2" opacity="0.12"/>
  <circle cx="1168" cy="108" r="42" fill="#E8EDF5" opacity="0.08"/>

  <!-- Mirror frames -->
  <rect x="520" y="90" width="180" height="240" rx="8" fill="#1E2838" stroke="#F2CC8F" stroke-opacity="0.35" stroke-width="3"/>
  <rect x="540" y="110" width="140" height="180" rx="4" fill="#2A3548" opacity="0.8"/>
  <rect x="860" y="80" width="160" height="220" rx="8" fill="#1E2838" stroke="#F2CC8F" stroke-opacity="0.25" stroke-width="3"/>
  <rect x="878" y="98" width="124" height="168" rx="4" fill="#2A3548" opacity="0.75"/>

  <!-- Fantasy barber chair -->
  <ellipse cx="720" cy="560" rx="130" ry="28" fill="#000" opacity="0.25"/>
  <path d="M620 560 L640 380 Q720 340 800 380 L820 560 Z" fill="url(#chair)"/>
  <rect x="690" y="300" width="60" height="90" rx="30" fill="url(#chair)"/>
  <path d="M650 560 L790 560 L770 520 L670 520 Z" fill="#6B2035"/>
  <circle cx="720" cy="420" r="8" fill="#F2CC8F" opacity="0.6"/>

  <!-- Side table & tools -->
  <rect x="480" y="480" width="90" height="80" rx="6" fill="url(#wood)" opacity="0.7"/>
  <rect x="500" y="460" width="8" height="40" rx="2" fill="#C0C4CC" opacity="0.7" transform="rotate(-15 504 480)"/>
  <rect x="530" y="455" width="6" height="36" rx="2" fill="#8B7355" opacity="0.8"/>

  <!-- Lanterns -->
  <line x1="380" y1="28" x2="380" y2="100" stroke="#F2CC8F" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="358" y="100" width="44" height="56" rx="4" fill="#E07A5F" opacity="0.85"/>
  <rect x="366" y="108" width="28" height="36" rx="2" fill="#FFD89B" opacity="0.55"/>
  <line x1="980" y1="28" x2="980" y2="80" stroke="#F2CC8F" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="958" y="80" width="44" height="56" rx="4" fill="#E07A5F" opacity="0.8"/>
  <rect x="966" y="88" width="28" height="36" rx="2" fill="#FFD89B" opacity="0.5"/>

  <!-- Cherry blossom petals -->
  <circle cx="200" cy="160" r="6" fill="#F4A7B9" opacity="0.55"/>
  <circle cx="260" cy="220" r="5" fill="#F4A7B9" opacity="0.45"/>
  <circle cx="150" cy="280" r="4" fill="#FFD1DC" opacity="0.5"/>
  <circle cx="1100" cy="200" r="5" fill="#F4A7B9" opacity="0.4"/>
  <circle cx="1280" cy="260" r="6" fill="#FFD1DC" opacity="0.45"/>
  <circle cx="1340" cy="180" r="4" fill="#F4A7B9" opacity="0.35"/>
  <circle cx="420" cy="320" r="4" fill="#FFD1DC" opacity="0.3"/>
  <circle cx="1050" cy="340" r="5" fill="#F4A7B9" opacity="0.35"/>

  <!-- Floor -->
  <rect x="0" y="580" width="1440" height="140" fill="#2A1F18" opacity="0.35"/>
  <line x1="0" y1="600" x2="1440" y2="600" stroke="#F2CC8F" stroke-opacity="0.08" stroke-width="2"/>
  <line x1="0" y1="640" x2="1440" y2="640" stroke="#F2CC8F" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Mist overlay for text readability -->
  <rect x="0" y="0" width="720" height="720" fill="#1A2332" opacity="0.55"/>
  <rect x="0" y="0" width="1440" height="720" fill="url(#sky)" opacity="0.15"/>
</svg>
