{% load static %}
<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}床山 — MSH Barbershop{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/samurai.css' %}"> {% block extra_head %}{% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/samurai.css' %}">
  </head>

  <body>
    <header class="site-header">
      <div class="container d-flex align-items-center justify-content-between">
        <a href="{% url 'barbershop:day_list' %}" class="brand text-decoration-none d-flex align-items-baseline gap-3">
          <span class="brand-mark">床山</span>
          <span class="brand-sub">Mohammd Shariati Barber</span>
        </a>
        <nav class="header-nav">{% block nav_note %}Book a chair{% endblock %}</nav>
      </div>
    </header>
    <main> {% block content %}{% endblock %} </main>
    <footer class="site-footer"> 床山 Tokoyama Barber · Open Tue–Sun </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/booking.js' %}"></script> {% block extra_scripts %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
    <script src="{% static 'js/booking.js' %}"></script>
  </body>

</html>
